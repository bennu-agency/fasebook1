<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="A responsive Facebook-inspired login interface." />
    <title>Log in | Facebook UI</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <button class="back-button" type="button" aria-label="Go back">
          <svg viewBox="0 0 28 28" aria-hidden="true">
            <path d="M18.75 4.75 9.5 14l9.25 9.25" />
          </svg>
        </button>
      </header>

      <main class="main-content">
        <section class="login-panel" aria-labelledby="page-title">
          <h1 class="sr-only" id="page-title">Log in to Facebook</h1>

          <div class="facebook-mark" aria-label="Facebook">
            <svg viewBox="0 0 120 120" role="img" aria-hidden="true">
              <circle cx="60" cy="60" r="58" />
              <path class="facebook-f" d="M67.8 102V65.5h12.25l2.25-14.25H67.8v-9.25c0-4.1 2.02-8.1 8.52-8.1h6.58V21.15s-5.97-1.02-11.68-1.02c-11.92 0-19.72 7.22-19.72 20.3v10.82H38.25V65.5H51.5V102Z" />
            </svg>
          </div>

          <form class="login-form" novalidate>
            <div class="field-group">
              <label class="sr-only" for="identity">Mobile number or email</label>
              <input id="identity" name="identity" type="text" autocomplete="username" placeholder="Mobile number or email" />
            </div>
            <div class="field-group">
              <label class="sr-only" for="password">Password</label>
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" />
            </div>

            <p class="form-message" role="status" aria-live="polite"></p>
            <button class="primary-button" type="submit">Log in</button>
          </form>

          <a class="forgot-link" href="#forgot">Forgot password?</a>
        </section>
      </main>

      <footer class="page-footer">
        <button class="create-button" type="button">Create new account</button>
        <div class="meta-lockup" aria-label="Meta">
          <svg viewBox="0 0 44 22" aria-hidden="true">
            <path d="M3 15.8C3 10.05 5.73 5.2 10.03 5.2c3.34 0 5.36 3.18 7.98 7.22 2.65 4.1 4.61 7.38 8.01 7.38 4.3 0 7.03-4.86 7.03-10.6 0-2.92-.74-4.92-2.2-6.34" />
            <path d="M41 15.8c0-5.75-2.73-10.6-7.03-10.6-3.34 0-5.36 3.18-7.98 7.22-2.65 4.1-4.61 7.38-8.01 7.38-4.3 0-7.03-4.86-7.03-10.6 0-2.92.74-4.92 2.2-6.34" />
          </svg>
          <span>Meta</span>
        </div>
      </footer>
    </div>

    <div class="toast" role="status" aria-live="polite"></div>
    <script src="/script.js"></script>
  </body>
</html>
